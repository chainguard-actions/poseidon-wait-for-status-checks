name: Test basic usage with token and timing inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          interval: "10"
          timeout: "5"
          delay: "1"
      - name: Assert action ran (may fail due to no real checks)
        run: |
          echo "Action completed (with or without error due to test environment)"
          echo "PASS: all timing inputs were accepted"
