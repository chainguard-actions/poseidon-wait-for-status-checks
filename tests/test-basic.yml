name: Test basic usage with token and timing inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          interval: "5"
          timeout: "10"
          delay: "1"
      - name: Assert action ran (may fail due to invalid token but inputs were accepted)
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "PASS: all timing inputs were accepted"
