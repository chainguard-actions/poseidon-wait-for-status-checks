name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run wait-for-checks with short timeout
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          timeout: '10'
          interval: '5'
          delay: '0'
        continue-on-error: true
      - name: Assert action ran (completed or timed out gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (no pending checks) or fail with timeout
          # Either way it must have run (not be skipped or errored unexpectedly)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
