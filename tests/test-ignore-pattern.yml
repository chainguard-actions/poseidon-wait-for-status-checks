name: Test ignore_pattern input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run wait-for-checks with ignore_pattern
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          timeout: '10'
          interval: '5'
          delay: '0'
          ignore_pattern: '.*'
        continue-on-error: true
      - name: Assert action ran with ignore_pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With ignore_pattern matching everything, all checks are ignored
          # so the action should succeed immediately
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
