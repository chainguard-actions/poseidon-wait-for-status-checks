name: Test ignore named checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run wait-for-checks with named ignore list
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          timeout: "10"
          interval: "5"
          delay: "0"
          ignore: "some-check,another-check"
        continue-on-error: true
      - name: Assert action ran with named ignore list
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With named checks to ignore, the action should succeed or timeout gracefully
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
