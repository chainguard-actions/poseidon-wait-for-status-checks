name: Test with delay parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with delay before first poll
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          timeout: '15'
          interval: '5'
          delay: '3'
        continue-on-error: true
      - name: Assert action ran with delay parameter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' when using delay parameter"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
