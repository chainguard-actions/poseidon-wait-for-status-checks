name: Test delay and interval inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          timeout: '10'
          interval: '5'
          delay: '2'
          ignore_pattern: '.*'
      - name: Assert action completed with delay and interval
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with delay=2 and interval=5"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and exited (API may not have check runs for this ref under act)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
