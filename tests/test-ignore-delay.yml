name: Test ignore and delay inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          ignore: "wait-for-checks"
          delay: "2"
          timeout: "10"
        continue-on-error: true
      - name: Assert action ran with ignore and delay
        run: |
          echo "Action completed with ignore=wait-for-checks and delay=2"
          echo "PASS"
